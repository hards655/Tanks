name: Build playable HTML
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'vendor/**'
      - 'package*.json'
      - 'p2p.js'
      - 'tests/**'
      - 'visuals.js'
      - 'track-rig.js'
      - 'style.css'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Commit playable HTML
        run: |
          if ! git diff --quiet -- index.html PLAY-ANDROID.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html PLAY-ANDROID.html
            git commit -m "Build updated playable HTML"
            git push
          fi
